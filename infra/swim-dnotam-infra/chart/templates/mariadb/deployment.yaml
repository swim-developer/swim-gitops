{{- if .Values.mariadb.enabled }}
{{- range .Values.mariadb.instances }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ .name }}
    component: database
    {{- include "swim-dnotam-infra.labels" $ | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .name }}
      component: database
  template:
    metadata:
      labels:
        app: {{ .name }}
        component: database
    spec:
      containers:
        - name: mariadb
          image: {{ $.Values.mariadb.image }}
          ports:
            - containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_DATABASE
              value: {{ .databaseName | quote }}
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}-credentials
                  key: user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}-credentials
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}-credentials
                  key: root-password
            - name: MARIADB_MYSQL_LOCALHOST_USER
              value: "0"
          resources:
            {{- toYaml $.Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: mariadb-run
              mountPath: /run/mariadb
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - mariadb-admin ping -u root -p"$MARIADB_ROOT_PASSWORD"
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - mariadb-admin ping -u root -p"$MARIADB_ROOT_PASSWORD"
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: {{ .name }}-data
        - name: mariadb-run
          emptyDir: {}
{{- end }}
{{- end }}
