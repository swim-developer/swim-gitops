{{- if and .Values.keycloak.enabled .Values.keycloak.spi.enabled }}
{{- $url := .Values.keycloak.spi.downloadUrl | default (printf "https://github.com/%s/releases/download/%s/%s" .Values.keycloak.spi.github.repository .Values.keycloak.spi.github.releaseTag .Values.keycloak.spi.github.assetName) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-spi-secret-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app: keycloak-spi-fetcher
    {{- include "swim-core-infra.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: {{ .Values.keycloak.spi.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.keycloak.spi.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: keycloak-spi-fetcher
    spec:
      serviceAccountName: keycloak-spi-fetcher
      restartPolicy: Never
      volumes:
        - name: spi-jar
          emptyDir: {}
      initContainers:
        - name: download-spi
          image: {{ .Values.keycloak.spi.job.curlImage }}
          env:
            - name: SPI_DOWNLOAD_URL
              value: {{ $url | quote }}
          command:
            - sh
            - -ec
            - |
              curl -fsSL -o /shared/{{ .Values.keycloak.spi.secretKey }} "${SPI_DOWNLOAD_URL}"
              ls -la /shared/
          volumeMounts:
            - name: spi-jar
              mountPath: /shared
      containers:
        - name: create-secret
          image: {{ .Values.keycloak.spi.job.cliImage }}
          env:
            - name: SPI_SECRET_NAME
              value: {{ .Values.keycloak.spi.secretName | quote }}
            - name: SPI_SECRET_KEY
              value: {{ .Values.keycloak.spi.secretKey | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              command -v oc >/dev/null 2>&1 && KUBE_CLI=oc || KUBE_CLI=kubectl
              ${KUBE_CLI} create secret generic "${SPI_SECRET_NAME}" \
                --namespace="{{ .Release.Namespace }}" \
                --from-file="${SPI_SECRET_KEY}"=/shared/${SPI_SECRET_KEY} \
                --dry-run=client -o yaml | ${KUBE_CLI} apply -f -
              echo "Secret ${SPI_SECRET_NAME} applied"
          volumeMounts:
            - name: spi-jar
              mountPath: /shared
          resources:
            {{- toYaml .Values.keycloak.spi.job.resources | nindent 12 }}
{{- end }}
