{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: keycloak-postgres
    app.kubernetes.io/component: postgres
    {{- include "swim-core-infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.keycloak.postgres.user }}
  POSTGRES_PASSWORD: {{ .Values.keycloak.postgres.password }}
  POSTGRES_DB: {{ .Values.keycloak.postgres.database }}
{{- end }}
