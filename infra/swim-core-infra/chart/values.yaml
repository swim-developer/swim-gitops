clusterDomain: apps-crc.testing

certManager:
  issuerName: swim-ca-issuer
  issuerKind: ClusterIssuer

pki:
  enabled: true
  certManagerNamespace: openshift-operators
  ca:
    commonName: SWIM Internal CA
    duration: 87600h
    algorithm: RSA
    size: 4096

kafka:
  enabled: true
  version: "4.0.0"
  metadataVersion: "4.0-IV3"
  replicas: 1
  storageSize: "2Gi"
  retention:
    ms: 604800000
    bytes: 268435456
    hours: 6

keycloak:
  enabled: true
  spi:
    enabled: false
    secretName: keycloak-swim-role-spi
    secretKey: keycloak-swim-role-spi.jar
    downloadUrl: ""
    github:
      repository: swim-developer/swim-developer-add-ons
      releaseTag: v1.0.0
      assetName: keycloak-swim-role-spi.jar
    job:
      curlImage: curlimages/curl:8.11.1
      cliImage: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      backoffLimit: 3
      activeDeadlineSeconds: 300
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 128Mi
          cpu: 200m
  replicas: 1
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi
  admin:
    username: admin
    password: password
  route:
    enabled: true
    hostname: "rhbk.apps-crc.testing"
  postgres:
    image: "registry.redhat.io/rhel9/postgresql-16:latest"
    database: keycloak
    user: keycloak
    password: password
    storageSize: "512Mi"
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: "1"
  realm:
    name: swim
    clients:
      amqBroker:
        clientId: amq-broker
        secret: GxMJF8kIcxZ5t6qmTdJPLSGZSOvo0Zrf
      dnotamProvider:
        clientId: swim-dnotam-provider
        secret: BtYGyfj6R1YvoKhEsDfjg0aMxSc8VyJ5
      ed254Provider:
        clientId: swim-ed254-provider
        secret: ed254-provider-secret
      publicClient:
        clientId: swim-public-client
    users:
      - username: marcelo
        password: password
        email: masales@redhat.com
        firstName: Marcelo
        lastName: Sales
      - username: ansp1
        password: password
        email: ansp1@swim.local
        firstName: ANSP
        lastName: One
      - username: ansp2
