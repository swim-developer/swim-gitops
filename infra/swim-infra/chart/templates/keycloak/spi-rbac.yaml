{{- if and .Values.keycloak.enabled .Values.keycloak.spi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-spi-fetcher
  namespace: {{ .Release.Namespace }}
  labels:
    app: keycloak-spi-fetcher
    {{- include "swim-infra.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-spi-fetcher
  namespace: {{ .Release.Namespace }}
  labels:
    app: keycloak-spi-fetcher
    {{- include "swim-infra.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-spi-fetcher
  namespace: {{ .Release.Namespace }}
  labels:
    app: keycloak-spi-fetcher
    {{- include "swim-infra.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-spi-fetcher
subjects:
  - kind: ServiceAccount
    name: keycloak-spi-fetcher
    namespace: {{ .Release.Namespace }}
{{- end }}
