{{- if .Values.artemis.validator.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: validator-artemis-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app: validator-artemis
    component: broker
    {{- include "swim-infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  AMQ_USER: {{ .Values.artemis.credentials.user }}
  AMQ_PASSWORD: {{ .Values.artemis.credentials.password }}
  AMQ_CLUSTER_USER: {{ .Values.artemis.credentials.user }}
  AMQ_CLUSTER_PASSWORD: {{ .Values.artemis.credentials.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: validator-artemis-keystore-password
  namespace: {{ .Release.Namespace }}
  labels:
    app: validator-artemis
    component: broker
    {{- include "swim-infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.artemis.keystorePassword }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: validator-artemis-amqp
  namespace: {{ .Release.Namespace }}
  labels:
    app: validator-artemis
    component: broker
    {{- include "swim-infra.labels" . | nindent 4 }}
spec:
  secretName: validator-artemis-amqp-tls
  issuerRef:
    name: {{ .Values.certManager.issuerName }}
    kind: {{ .Values.certManager.issuerKind }}
  commonName: validator-artemis
  dnsNames:
    - validator-artemis-amqps-0-svc.{{ .Release.Namespace }}.svc.cluster.local
    - validator-artemis-hdls-svc.{{ .Release.Namespace }}.svc.cluster.local
    - validator-artemis-amqps-0-svc.{{ .Release.Namespace }}.svc
    - validator-artemis-hdls-svc.{{ .Release.Namespace }}.svc
    - validator-artemis-amqps-0-svc.{{ .Release.Namespace }}
    - validator-artemis-hdls-svc.{{ .Release.Namespace }}
    - validator-artemis-amqps-0-svc
    - validator-artemis-hdls-svc
    - validator-artemis
    - localhost
  usages:
    - server auth
    - client auth
  keystores:
    jks:
      create: true
      passwordSecretRef:
        name: validator-artemis-keystore-password
        key: password
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
---
apiVersion: broker.amq.io/v1beta1
kind: ActiveMQArtemis
metadata:
  name: validator-artemis
  namespace: {{ .Release.Namespace }}
  labels:
    app: validator-artemis
    component: broker
    {{- include "swim-infra.labels" . | nindent 4 }}
spec:
  acceptors:
    - name: amqps
      port: 5671
      protocols: AMQP
      sslEnabled: true
      sslSecret: validator-artemis-ssl-secret
      needClientAuth: true
      verifyHost: false
      expose: true
    - name: amqp
      port: 5672
      protocols: AMQP
      sslEnabled: false
      expose: false
  adminUser: {{ .Values.artemis.credentials.user }}
  adminPassword: {{ .Values.artemis.credentials.password }}
  brokerProperties:
    - globalMaxSize={{ .Values.artemis.validator.globalMaxSize }}
    - addressSettings.#.expiryDelay=86400000
    - addressSettings.#.expiryAddress=ExpiryQueue
    - addressSettings.#.autoDeleteQueues=true
    - addressSettings.#.autoDeleteAddresses=true
  console:
    expose: true
    sslEnabled: false
  deploymentPlan:
    image: placeholder
    journalType: nio
    messageMigration: false
    persistenceEnabled: true
    requireLogin: true
    size: 1
    resources:
      {{- toYaml .Values.artemis.validator.resources | nindent 6 }}
{{- end }}
