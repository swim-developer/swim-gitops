clusterDomain: apps-crc.testing

certManager:
  issuerName: swim-ca-issuer
  # Namespaced Issuer so CA secret in swim-demo works with Argo (single destination namespace).
  issuerKind: Issuer

modules:
  - dnotam
  - ed254

pki:
  enabled: true
  # Argo CD Application destination is swim-demo; CA material must stay in that namespace.
  certManagerNamespace: swim-demo
  ca:
    commonName: SWIM Internal CA
    duration: 87600h
    algorithm: RSA
    size: 4096

kafka:
  enabled: true
  # AMQ Streams 3.2 on CRC supports 4.1.x / 4.2.x (not 4.0.0).
  version: "4.1.0"
  metadataVersion: "4.1-IV0"
  replicas: 1
  storageSize: "2Gi"
  retention:
    ms: 604800000
    bytes: 268435456
    hours: 6
  topics:
    - name: dnotam-inbox-topic
      partitions: 10
      module: dnotam
    - name: dnotam-events-all-topic
      partitions: 10
      module: dnotam
    - name: dnotam-events-closure-topic
      partitions: 3
      module: dnotam
    - name: dnotam-events-restriction-topic
      partitions: 3
      module: dnotam
    - name: dnotam-events-surface-condition-topic
      partitions: 3
      module: dnotam
    - name: dnotam-events-airspace-topic
      partitions: 3
      module: dnotam
    - name: dnotam-events-hazards-navaids-topic
      partitions: 3
      module: dnotam
    - name: dnotam-events-others-topic
      partitions: 3
      module: dnotam
    - name: dnotam-events-dlq-topic
      partitions: 1
      module: dnotam
    - name: ed254-inbox-topic
      partitions: 10
      module: ed254
    - name: ed254-arrival-sequence-topic
      partitions: 3
      module: ed254
    - name: ed254-provider-exception-topic
      partitions: 3
      module: ed254
    - name: ed254-dlq-topic
      partitions: 1
      module: ed254
    - name: ed254-outbox
      partitions: 3
      module: ed254
    - name: ed254-dlq
      partitions: 1
      module: ed254

artemis:
  credentials:
    user: admin
    password: admin
  keystorePassword: changeit
  validator:
    enabled: true
    globalMaxSize: 256m
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: "1"
  provider:
    enabled: true
    globalMaxSize: 512m
    extraSecrets:
      - provider-artemis-dnotam-address-bp
      - provider-artemis-dnotam-security-bp
      - provider-artemis-ed254-address-bp
      - provider-artemis-ed254-security-bp
      - provider-artemis-ffice-address-bp
      - provider-artemis-ffice-security-bp
    oidc:
      enabled: true
      realm: swim
      authServerUrl: "https://rhbk.apps-crc.testing/"
      clientId: amq-broker
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: "1"

mongodb:
  enabled: true
  image: "quay.io/mongodb/mongodb-community-server:8.0-ubi9-slim"
  storageSize: "1Gi"
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: "1"
  credentials:
    user: swim
    password: swim123
    adminPassword: admin123
  instances:
    - name: dnotam-consumer-mongodb
      databaseName: swim-dnotam
      module: dnotam
    - name: ed254-consumer-mongodb
      databaseName: swim-ed254
      module: ed254

mariadb:
  enabled: true
  image: "docker.io/library/mariadb:12-ubi"
  storageSize: "1Gi"
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: "1"
  credentials:
    user: swim
    password: swim
    rootPassword: root
  instances:
    - name: dnotam-consumer-validator-mariadb
      databaseName: swim_consumer_validator
      module: dnotam
    - name: ed254-consumer-validator-mariadb
      databaseName: swim_ed254_consumer_validator
      module: ed254
    - name: dnotam-provider-validator-mariadb
      databaseName: swim_provider_validator
      module: dnotam
    - name: swim-ed254-provider-validator-mariadb
      databaseName: swim_client
      module: ed254

postgres:
  enabled: true
  image: "registry.redhat.io/rhel9/postgresql-16:latest"
  storageSize: "1Gi"
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: "1"
  credentials:
    user: swim-provider
    password: swim-provider
  instances:
    - name: dnotam-provider-postgres
      databaseName: swim-dnotam
      module: dnotam
    - name: ed254-provider-postgres
      databaseName: ed254_provider
      module: ed254

