kafka:
  enabled: true
  retention:
    ms: 604800000
    bytes: 268435456
  topics:
    - name: ffice-inbox-topic
      partitions: 10
    - name: ffice-events-all-topic
      partitions: 10
    - name: ffice-events-dlq-topic
      partitions: 1
    - name: ffice-outbox
      partitions: 3
    - name: ffice-dlq
      partitions: 1

mongodb:
  enabled: true
  image: "quay.io/mongodb/mongodb-community-server:8.0-ubi9-slim"
  storageSize: "1Gi"
  credentials:
    user: swim
    password: swim123
    adminPassword: admin123
  instances:
    - name: ffice-consumer-mongodb
      databaseName: swim-ffice

mariadb:
  enabled: true
  image: "docker.io/library/mariadb:12-ubi"
  storageSize: "1Gi"
  credentials:
    user: swim
    password: swim
    rootPassword: root
  instances:
    - name: ffice-consumer-validator-mariadb
      databaseName: swim_ffice_consumer_validator
    - name: ffice-provider-validator-mariadb
      databaseName: swim_ffice_provider_validator

postgres:
  enabled: true
  image: "registry.redhat.io/rhel9/postgresql-16:latest"
  storageSize: "1Gi"
  credentials:
    user: swim-provider
    password: swim-provider
  instances:
    - name: ffice-provider-postgres
      databaseName: ffice_provider
