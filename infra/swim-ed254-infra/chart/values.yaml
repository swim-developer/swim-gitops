kafka:
  enabled: true
  retention:
    ms: 604800000
    bytes: 268435456
  topics:
    - name: ed254-inbox-topic
      partitions: 10
    - name: ed254-arrival-sequence-topic
      partitions: 3
    - name: ed254-provider-exception-topic
      partitions: 3
    - name: ed254-dlq-topic
      partitions: 1
    - name: ed254-outbox
      partitions: 3
    - name: ed254-dlq
      partitions: 1

mongodb:
  enabled: true
  image: "quay.io/mongodb/mongodb-community-server:8.0-ubi9-slim"
  storageSize: "1Gi"
  credentials:
    user: swim
    password: swim123
    adminPassword: admin123
  instances:
    - name: ed254-consumer-mongodb
      databaseName: swim-ed254

mariadb:
  enabled: true
  image: "docker.io/library/mariadb:12-ubi"
  storageSize: "1Gi"
  credentials:
    user: swim
    password: swim
    rootPassword: root
  instances:
    - name: ed254-consumer-validator-mariadb
      databaseName: swim_ed254_consumer_validator
    - name: swim-ed254-provider-validator-mariadb
      databaseName: swim_client

postgres:
  enabled: true
  image: "registry.redhat.io/rhel9/postgresql-16:latest"
  storageSize: "1Gi"
  credentials:
    user: swim-provider
    password: swim-provider
  instances:
    - name: ed254-provider-postgres
      databaseName: ed254_provider
