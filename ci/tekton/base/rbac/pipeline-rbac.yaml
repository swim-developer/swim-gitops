# ServiceAccount for the Tekton pipeline pods.
# OpenShift Pipelines uses the 'pipeline' SA by default.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: swim-pipeline
  labels:
    app.kubernetes.io/part-of: swim-gitops
---
# Allow the pipeline SA to list/get secrets it needs
# (quay-push-auth, etc.) within the swim-pipeline namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: swim-pipeline-runner
  namespace: swim-pipeline
  labels:
    app.kubernetes.io/part-of: swim-gitops
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "tasks", "pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swim-pipeline-runner
  namespace: swim-pipeline
  labels:
    app.kubernetes.io/part-of: swim-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: swim-pipeline-runner
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: swim-pipeline
