# Single-module Quarkus repo at workspace root (no -pl).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: swim-maven-native-build-root
  namespace: swim-pipeline
  labels:
    app.kubernetes.io/part-of: swim-gitops
spec:
  description: >-
    Native build for a single Maven module at repository root.
    Clones and installs swim-validators parent POM before building.
    WARNING: Requires GraalVM/Mandrel, 12Gi+ RAM and 4+ CPUs.
  params:
    - name: MAVEN_GOALS
      type: string
      default: "clean package"
    - name: EXTRA_ARGS
      type: string
      default: ""
    - name: root-pom-url
      type: string
      default: http://gitea-http.gitea.svc.cluster.local:3000/swimadmin/swim-developer-root.git
      description: Git URL for the swim-developer root parent POM (always installed first)
    - name: dep-repos
      type: string
      default: http://gitea-http.gitea.svc.cluster.local:3000/swimadmin/swim-developer-validators.git
      description: >-
        Space-separated list of Git repo URLs to clone and install before building.
        Validators: swim-developer-validators URL
        Services: swim-developer-framework URL + swim-developer-extensions URL + model URL
  workspaces:
    - name: source
    - name: maven-cache
  steps:
    - name: install-parent-pom
      image: docker.io/maven:3.9-eclipse-temurin-21
      securityContext:
        runAsUser: 0
      env:
        - name: HOME
          value: /root
      computeResources:
        requests:
          memory: 512Mi
          cpu: 200m
        limits:
          memory: 1Gi
          cpu: "1"
      script: |
        #!/bin/bash
        set -e
        MAVEN_REPO="$(workspaces.maven-cache.path)"
        VALIDATORS_DIR="/tmp/swim-validators"
        chmod -R a+rwX $(workspaces.source.path) || true
        chmod -R a+rwX "${MAVEN_REPO}" || true

        echo "==> [1/N] Installing swim-developer-root (root parent POM)..."
        GIT_TERMINAL_PROMPT=0 git clone --depth=1 $(params.root-pom-url) /tmp/swim-dep-root
        cd /tmp/swim-dep-root
        mvn install -DskipTests -Dmaven.repo.local="${MAVEN_REPO}" -q
        echo "    swim-developer-root OK"

        i=2
        for REPO_URL in $(params.dep-repos); do
          REPO_NAME=$(basename "${REPO_URL}" .git)
          DEST="/tmp/swim-dep-${REPO_NAME}"
          echo "==> [${i}/N] Installing ${REPO_NAME}..."
          GIT_TERMINAL_PROMPT=0 git clone --depth=1 "${REPO_URL}" "${DEST}"
          cd "${DEST}"
          mvn install -DskipTests -Dmaven.repo.local="${MAVEN_REPO}" -q
          echo "    ${REPO_NAME} OK"
          i=$((i+1))
        done

    - name: native-build
      image: quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-21
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsUser: 0
      computeResources:
        requests:
          memory: 12Gi
          cpu: "4"
        limits:
          memory: 16Gi
          cpu: "8"
      env:
        - name: HOME
          value: /root
      script: |
        #!/bin/bash
        set -e
        MAVEN_REPO="$(workspaces.maven-cache.path)"
        MVN_CMD="./mvnw"
        if [ ! -x "${MVN_CMD}" ]; then
          MVN_CMD="mvn"
        fi
        ${MVN_CMD} $(params.MAVEN_GOALS) \
          -Dnative -DskipTests \
          -Dmaven.repo.local="${MAVEN_REPO}" \
          $(params.EXTRA_ARGS)
        BINARY=$(ls target/*-runner 2>/dev/null | head -1)
        if [ -z "${BINARY}" ]; then
          echo "ERROR: Native binary not found under target/"
          exit 1
        fi
        ls -lh "${BINARY}"
