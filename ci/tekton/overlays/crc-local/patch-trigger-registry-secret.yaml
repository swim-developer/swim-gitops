# Strategic merge patches: replace quay-push-auth with internal-registry-auth
# in every TriggerTemplate so that automatic pipeline runs (via webhook)
# also push to the OpenShift internal registry.
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  namespace: swim-pipeline
  name: swim-dnotam-consumer-validator-template
spec:
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: swim-dnotam-consumer-validator-
      spec:
        workspaces:
          - name: docker-credentials
            secret:
              secretName: internal-registry-auth
---
