# JSON6902 patches: replace only the image-name default value in each pipeline.
# image-name is params[2] (index 2, zero-based) in all SWIM service pipelines.
# Layout: [0]=git-url, [1]=git-revision, [2]=image-name, [3]=image-tag

- target:
    group: tekton.dev
    version: v1
    kind: Pipeline
    name: swim-dnotam-consumer-validator-ci
    namespace: swim-pipeline
  patch: |
    - op: replace
      path: /spec/params/2/default
      value: "image-registry.openshift-image-registry.svc:5000/swim-demo/swim-dnotam-consumer-validator"

- target:
    group: tekton.dev
    version: v1
    kind: Pipeline
