# TriggerBinding and TriggerTemplate for each SWIM service repo.
# Each pair maps a GitHub push event to a PipelineRun.
# Workspaces use volumeClaimTemplate (ephemeral per run) for source
# and the shared maven-repo-pvc for the Maven cache.

# ─────────────────────────────────────────────────────────────────────────────
# DNOTAM consumer-validator
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: swim-dnotam-consumer-validator-binding
  namespace: swim-pipeline
  labels:
    app.kubernetes.io/part-of: swim-gitops
spec:
  params:
    - name: git-revision
      value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: swim-dnotam-consumer-validator-template
  namespace: swim-pipeline
  labels:
    app.kubernetes.io/part-of: swim-gitops
spec:
  params:
    - name: git-revision
      default: main
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: swim-dnotam-consumer-validator-
        namespace: swim-pipeline
        labels:
          app.kubernetes.io/part-of: swim-gitops
          tekton.dev/pipeline: swim-dnotam-consumer-validator-ci
      spec:
        pipelineRef:
          name: swim-dnotam-consumer-validator-ci
        params:
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: image-tag
            value: $(tt.params.git-revision)
        workspaces:
          - name: shared-workspace
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
          - name: maven-cache
            persistentVolumeClaim:
              claimName: maven-repo-pvc
          - name: docker-credentials
            secret:
              secretName: quay-push-auth

