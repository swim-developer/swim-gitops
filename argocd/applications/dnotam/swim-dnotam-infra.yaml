apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swim-dnotam-infra
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: swim
  sources:
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/swimadmin/swim-gitops.git
      targetRevision: main
      path: infra/swim-dnotam-infra/chart
      helm:
        releaseName: swim-dnotam-infra
        valueFiles:
          - $values/apps/dnotam/infra/overlays/crc-local/values.yaml
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/swimadmin/swim-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: swim-demo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
